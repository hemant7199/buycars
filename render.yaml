# render.yaml — Deploy buycars.com to Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (Flask + Gunicorn) ───────────────────────────────────────────────
  - type: web
    name: buycars-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: buycars-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://buycars-frontend.onrender.com
      - key: FLASK_DEBUG
        value: "0"
      - key: REDIS_URL
        fromService:
          name: buycars-redis
          type: redis
          property: connectionString
      - key: SENTRY_DSN
        sync: false   # Set manually in Render dashboard from sentry.io

  # ── Frontend (Vite static site) ──────────────────────────────────────────────
  - type: web
    name: buycars-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://buycars-backend.onrender.com

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: buycars-db
    databaseName: buycars
    user: buycars
    region: singapore
    plan: free

# ── Redis Cache ───────────────────────────────────────────────────────────────
# Note: Render Redis is in beta; alternatively set REDIS_URL manually
# from a Render Redis instance or any Redis provider (Upstash, etc.)
